<!-- BEGIN BOOTGUARD -->
<script>
  (function () {
    // round-2 QA UI-29: while the module graph downloads, the boot bar creeps 0 → 4 % (asymptotic) so the player sees
    // it move; ui.setBootProgress removes .creep on its first call and owns the bar from then on. Round 3: the fill is a
    // full-width strip slid by a transform (compositor-only, css #boot-fill), so the creep writes translateX(w − 100 %)
    (function creep() {
      var fill = document.getElementById('boot-fill');
      if (!fill || !fill.classList || !fill.classList.contains('creep')) return;
      var w = 0;
      function step() {
        if (!fill.classList.contains('creep')) return;
        w += (4 - w) * 0.18;
        fill.style.transform = 'translateX(' + (w - 100).toFixed(2) + '%)';
        setTimeout(step, 150);
      }
      step();
    })();
    // round 4 (r3 FTUE residual 5): on a first visit the boot logo painted in the fallback face (Arial Black) and then
    // swapped to Lilita One. The logo starts hidden (.font-wait, css) and fades in once its face has loaded, or after
    // LOGO_FONT_CAP_MS whichever comes first (a slow network still sees the fallback, never a missing logo for long).
    // The bar and the boot text stay visible throughout. The stylesheet links above block this script, so the
    // @font-face rules exist; no FontFaceSet (or a failed font CSS → load resolves empty) shows the logo at once.
    (function logoFont() {
      var LOGO_FONT_CAP_MS = 1200;
      var logo = document.querySelector('#scr-boot .logo');
      if (!logo || !logo.classList) return;
      var shown = false;
      function show() { if (shown) return; shown = true; logo.classList.remove('font-wait'); }
      try {
        var fonts = document.fonts;
        if (!fonts || typeof fonts.load !== 'function') { show(); return; }
        setTimeout(show, LOGO_FONT_CAP_MS);
        fonts.load('400 1em "Lilita One"', 'GATE RUSH').then(show, show);
      } catch (e) { show(); }
    })();
    function show(msg) {
      var b = document.getElementById('error-box');
      var t = document.getElementById('error-text');
      if (!b) return;
      if (t) t.textContent = msg || 'Load error';
      b.hidden = false;
      var r = document.getElementById('btn-reload');
      if (r && !r.getAttribute('data-wired')) {
        r.setAttribute('data-wired', '1');
        r.addEventListener('click', function () { try { location.reload(); } catch (e) {} });
      }
    }
    // main.js installs window.onerror / onunhandledrejection at the top of the module (§4.1 step 0);
    // from then on it owns the error surface and this guard only covers load failures before it ran.
    // 1.2.0 release: a load failure first asks window.__gateRushHeal (index.html only: the script after END BOOTGUARD
    // finishes a pending service-worker update instead of failing); it returns true while it takes over.
    function fail(msg) {
      var h = window.__gateRushHeal;
      try { if (typeof h === 'function' && h(msg, show)) return; } catch (e) { /* the error box */ }
      show(msg);
    }
    window.addEventListener('error', function (e) {
      if (typeof window.onerror === 'function') return;
      fail((e && e.message) || 'Load error');
    });
    // a module that fails to download (CDN or network down) fires `error` on its <script> only, not on
    // window: catch it in the capture phase so the player sees RELOAD instead of a frozen boot screen
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (!t || t === window || !t.tagName || t.tagName !== 'SCRIPT') return;
      if (typeof window.onerror === 'function') return;
      fail('Load error');
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (typeof window.onunhandledrejection === 'function') return;
      var r = e && e.reason;
      show(r && r.message ? r.message : (typeof r === 'string' ? r : 'Load error'));
    });
    if (!window.HTMLScriptElement || !HTMLScriptElement.supports || !HTMLScriptElement.supports('importmap')) {
      show('This browser cannot load the game (no import maps).');
    }
    // watchdog: a stalled module / CDN download fires no error event at all, so after 20 s of boot screen
    // the error box offers RELOAD; it hides itself again if the game finishes booting after all
    // Only VISIBLE boot time counts: a page that boots in a background tab gets no animation frames, so its boot
    // crawls on timer fallbacks — that is not a connection problem and must not say so (release check, v1.1.0).
    var STALL_MS = 20000, STALL_MSG = 'Still loading… check your connection', stallShown = false, visibleMs = 0;
    function booted() { var s = document.getElementById('scr-boot'); return !s || s.hidden; }
    function pageVisible() { try { return document.visibilityState !== 'hidden'; } catch (e) { return true; } }
    function watchdog() {
      var b = document.getElementById('error-box'), t = document.getElementById('error-text');
      if (booted()) {
        if (stallShown && b && t && t.textContent === STALL_MSG) b.hidden = true;
        return;
      }
      if (pageVisible()) visibleMs += 1000;
      var hl = window.__gateRushHeal;
      if (!stallShown && !(hl && hl.active) && visibleMs >= STALL_MS && b && b.hidden) { stallShown = true; show(STALL_MSG); }
      setTimeout(watchdog, 1000);
    }
    setTimeout(watchdog, 1000);
  })();
</script>
<!-- END BOOTGUARD -->
<script>
  // 1.2.0 release (index.html only; the artifact shell has no service worker): finish an update instead of failing.
  // The 1.1.0 worker (sw.js v3) served code network-first with a 3 s budget per file, so the first launch after the
  // update on a slow network could link a 1.2.0 module against the cached 1.1.0 data.js ("does not provide an export
  // named …"). On a load error in a page that a worker controls, when the registration has a newer worker installing or
  // waiting (sw.js v4+ installs one complete, verified build and waits), that worker takes over (SKIP_WAITING) and the
  // page reloads into it on controllerchange: one consistent build. Once per session (sessionStorage, else once per
  // page). No controller, no newer worker after an update check, or HEAL_MS without a takeover → the boot guard's error
  // box with RELOAD, as before. The boot guard calls it (window.__gateRushHeal); main.js's own handlers never do.
  (function () {
    var HEAL_MS = 60000;
    function heal(msg, show) {
      if (heal.active) return true;
      var sw = null;
      try { sw = navigator.serviceWorker || null; } catch (e) { sw = null; }
      if (!sw || !sw.controller || typeof sw.getRegistration !== 'function') return false;
      try { if (sessionStorage.getItem('gaterush.heal')) return false; sessionStorage.setItem('gaterush.heal', '1'); } catch (e) { /* no storage: once per page */ }
      heal.active = true;
      var done = false;
      var bt = document.getElementById('boot-text');
      var bootText = bt ? bt.textContent : '';
      var fail = function () { if (done) return; done = true; heal.active = false; if (bt) bt.textContent = bootText; show(msg); };
      var reload = function () { if (done) return; done = true; try { location.reload(); } catch (e) { /* nothing left */ } };
      setTimeout(fail, HEAL_MS);
      if (bt) bt.textContent = 'Finishing the update…';
      try {
        sw.addEventListener('controllerchange', reload);
        sw.getRegistration().then(function (reg) {
          if (!reg) { fail(); return; }
          var take = function (w) {
            if (!w) return false;
            var skip = function () { try { w.postMessage({ type: 'SKIP_WAITING' }); } catch (e) { fail(); } };
            if (w.state === 'installed') skip();
            else w.addEventListener('statechange', function () { if (w.state === 'installed') skip(); else if (w.state === 'redundant') fail(); });
            return true;
          };
          if (take(reg.waiting || reg.installing)) return;
          reg.addEventListener('updatefound', function () { take(reg.installing); });
          reg.update().then(function () { if (!reg.installing && !reg.waiting) fail(); }, fail);
        }, fail);
      } catch (e) { fail(); }
      return true;
    }
    heal.active = false;
    window.__gateRushHeal = heal;
  })();
</script>
